name: Deploy Automático AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4

      - name: 2. Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: 3. Fazer o Build com Maven
        run: mvn clean package

      - name: 4. Configurar credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: 5. Deploy das Funções Lambda
        run: |
          aws lambda update-function-code --function-name ReceberAvaliacao --zip-file fileb://target/feedback-serverless-1.0-SNAPSHOT.jar
          aws lambda update-function-code --function-name ProcessarFeedbackStream --zip-file fileb://target/feedback-serverless-1.0-SNAPSHOT.jar
          aws lambda update-function-code --function-name GerarRelatorioSemanal --zip-file fileb://target/feedback-serverless-1.0-SNAPSHOT.jar